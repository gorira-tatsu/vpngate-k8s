apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egress-plugin.fullname" . }}
  labels:
    {{- include "egress-plugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "egress-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "egress-plugin.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- if and (eq .Values.mode "vpngate") .Values.vpngate.killSwitch.enabled }}
      # Kill switch: traffic may leave the pod only through the tunnel, to the VPN server itself, or to
      # cluster-internal addresses. While OpenVPN is down or reconnecting, the proxy fails instead of
      # leaking out through the node's own address.
      initContainers:
        - name: killswitch
          image: "{{ .Values.vpngate.killSwitch.image }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "/killswitch/killswitch.sh"]
          env:
            - name: IPTABLES
              value: {{ .Values.vpngate.killSwitch.iptables | quote }}
            - name: ALLOW_CIDRS
              value: {{ join " " .Values.vpngate.killSwitch.allowCidrs | quote }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
              readOnly: true
            - name: killswitch
              mountPath: /killswitch
              readOnly: true
      {{- end }}
      containers:
        {{- if eq .Values.mode "tor" }}
        - name: torproxy
          image: "{{ .Values.tor.image.repository }}:{{ .Values.tor.image.tag }}"
          imagePullPolicy: {{ .Values.tor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8118
              protocol: TCP
            - name: socks
              containerPort: 9050
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: socks
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.tor.resources | nindent 12 }}
        {{- else if eq .Values.mode "vpngate" }}
        {{- if not (or .Values.vpngate.existingSecret .Values.vpngate.inlineConfig) }}
        {{- fail "vpngate mode requires vpngate.existingSecret or vpngate.inlineConfig" }}
        {{- end }}
        - name: openvpn
          image: "{{ .Values.vpngate.openvpn.image.repository }}:{{ .Values.vpngate.openvpn.image.tag }}"
          imagePullPolicy: {{ .Values.vpngate.openvpn.image.pullPolicy }}
          command:
            {{- toYaml .Values.vpngate.openvpn.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.vpngate.openvpn.securityContext | nindent 12 }}
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.vpngate.openvpn.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.vpngate.openvpn.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.vpngate.openvpn.resources | nindent 12 }}
        - name: http-proxy
          image: "{{ .Values.vpngate.proxy.image.repository }}:{{ .Values.vpngate.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.vpngate.proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vpngate.proxy.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.vpngate.proxy.resources | nindent 12 }}
        {{- if .Values.vpngate.tcpRelay.enabled }}
        - name: tcp-relay
          image: "{{ .Values.vpngate.tcpRelay.image.repository }}:{{ .Values.vpngate.tcpRelay.image.tag }}"
          imagePullPolicy: {{ .Values.vpngate.tcpRelay.image.pullPolicy }}
          args:
            - "tcp-listen:{{ .Values.service.tcpRelayPort }},fork,reuseaddr"
            - "tcp:{{ .Values.vpngate.tcpRelay.upstreamHost }}:{{ .Values.vpngate.tcpRelay.upstreamPort }}"
          ports:
            - name: tcp-relay
              containerPort: {{ .Values.service.tcpRelayPort }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "nc -z 127.0.0.1 {{ .Values.service.tcpRelayPort }}"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.vpngate.tcpRelay.resources | nindent 12 }}
        {{- end }}
        {{- else }}
        {{- fail "mode must be either tor or vpngate" }}
        {{- end }}
      {{- if eq .Values.mode "vpngate" }}
      volumes:
        {{- if .Values.vpngate.killSwitch.enabled }}
        - name: killswitch
          configMap:
            name: {{ include "egress-plugin.fullname" . }}-killswitch
            defaultMode: 0555
        {{- end }}
        - name: openvpn-config
          secret:
            secretName: {{ include "egress-plugin.vpngateSecretName" . }}
            items:
              - key: {{ .Values.vpngate.secretKey }}
                path: client.ovpn
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
