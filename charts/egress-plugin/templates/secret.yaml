{{- if and (eq .Values.mode "vpngate") (not .Values.vpngate.existingSecret) .Values.vpngate.inlineConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "egress-plugin.vpngateSecretName" . }}
  labels:
    {{- include "egress-plugin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.vpngate.secretKey }}: |
{{ .Values.vpngate.inlineConfig | indent 4 }}
{{- end }}
