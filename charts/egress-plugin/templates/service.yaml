apiVersion: v1
kind: Service
metadata:
  name: {{ include "egress-plugin.fullname" . }}
  labels:
    {{- include "egress-plugin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "egress-plugin.selectorLabels" . | nindent 4 }}
  ports:
    {{- if eq .Values.mode "tor" }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: socks
      port: {{ .Values.service.socksPort }}
      targetPort: socks
      protocol: TCP
    {{- else if eq .Values.mode "vpngate" }}
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- else }}
    {{- fail "mode must be either tor or vpngate" }}
    {{- end }}
