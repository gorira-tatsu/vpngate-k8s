{{- if .Values.rotation.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "egress-plugin.fullname" . }}-rotator
  labels:
    {{- include "egress-plugin.labels" . | nindent 4 }}
data:
  rotate.sh: |
    #!/bin/sh
    set -eu

    require() {
      command -v "$1" >/dev/null 2>&1 || {
        echo "$1 is required" >&2
        exit 1
      }
    }

    restart_deployment() {
      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl -n "$NAMESPACE" patch deployment "$TARGET_DEPLOYMENT" \
        -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"vpngate-k8s.local/rotated-at\":\"$now\"}}}}}"
      kubectl -n "$NAMESPACE" rollout status deployment/"$TARGET_DEPLOYMENT" --timeout="$ROLLOUT_TIMEOUT"
    }

    record_status() {
      status="$1"
      selected_host="$2"
      message="$3"
      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl -n "$NAMESPACE" create configmap egress-plugin-status \
        --from-literal=status="$status" \
        --from-literal=vpngate_host="$selected_host" \
        --from-literal=message="$message" \
        --from-literal=validated_at="$now" \
        --from-literal=validation_urls="${VALIDATION_URLS:-http://example.com/ https://example.com/ https://www.digital.go.jp/ https://www.nta.go.jp/ https://www.soumu.go.jp/}" \
        --dry-run=client -o yaml | kubectl apply -f -
    }

    validate_proxy() {
      timeout="${VALIDATION_TIMEOUT_SECONDS:-12}"
      proxy="http://$TARGET_DEPLOYMENT.$NAMESPACE.svc.cluster.local:8118"
      for url in ${VALIDATION_URLS:-http://example.com/ https://example.com/ https://www.digital.go.jp/ https://www.nta.go.jp/ https://www.soumu.go.jp/}; do
        curl -fsS -m "$timeout" -x "$proxy" "$url" >/dev/null || return 1
      done
    }

    require kubectl
    require date

    if [ "$MODE" = "tor" ]; then
      restart_deployment
      exit 0
    fi

    if [ "$MODE" != "vpngate" ]; then
      echo "Unsupported mode: $MODE" >&2
      exit 2
    fi

    require awk
    require base64
    require curl
    require sort

    tmp="$(mktemp)"
    candidates="$(mktemp)"
    trap 'rm -f "$tmp" "$candidates"' EXIT

    curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "https://www.vpngate.net/api/iphone/" > "$tmp"

    awk -F, \
      -v country="$VPNGATE_COUNTRY" \
      -v host="${VPNGATE_HOST:-}" \
      -v randomize="$VPNGATE_RANDOM" '
      BEGIN { srand() }
      /^#/ { next }
      NF < 15 { next }
      country != "" && $7 != country { next }
      host != "" && $1 != host { next }
      {
        key = NR
        if (randomize == "true") {
          key = rand()
        }
        print key "\t" $1 "\t" $15
      }
    ' "$tmp" | sort -n > "$candidates"

    if [ ! -s "$candidates" ]; then
      echo "No VPNGate entry matched the requested filters." >&2
      exit 1
    fi

    attempts="${VALIDATION_ATTEMPTS:-8}"
    tried=0
    while IFS="$(printf '\t')" read -r _ selected_host encoded; do
      tried=$((tried + 1))
      if [ "$tried" -gt "$attempts" ]; then
        break
      fi

      decoded="$(
        printf '%s' "$encoded" |
          base64 -d |
          awk '!/^data-ciphers([[:space:]]|$)/ && !/^data-ciphers-fallback([[:space:]]|$)/'
      )"

      if [ -z "$decoded" ]; then
        echo "Skipping empty VPNGate config for $selected_host" >&2
        continue
      fi

      echo "Trying VPNGate host $selected_host ($tried/$attempts)"
      kubectl -n "$NAMESPACE" create secret generic "$VPNGATE_SECRET" \
        --from-literal="$VPNGATE_SECRET_KEY=$decoded" \
        --dry-run=client -o yaml | kubectl apply -f -

      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl -n "$NAMESPACE" annotate secret "$VPNGATE_SECRET" \
        vpngate-k8s.local/vpngate-host="$selected_host" \
        vpngate-k8s.local/rotated-at="$now" \
        --overwrite

      restart_deployment

      if validate_proxy; then
        echo "Validated VPNGate host $selected_host"
        record_status ok "$selected_host" "proxy validation passed"
        exit 0
      fi

      echo "Validation failed for VPNGate host $selected_host" >&2
      record_status failed "$selected_host" "proxy validation failed"
    done < "$candidates"

    echo "No VPNGate host passed proxy validation after $tried attempt(s)." >&2
    record_status failed "" "no candidate passed proxy validation"
    exit 1
{{- end }}
