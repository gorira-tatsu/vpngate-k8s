mode: tor

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  httpPort: 8118
  socksPort: 9050
  tcpRelayPort: 9043

rotation:
  enabled: false
  schedule: "0 */6 * * *"
  image:
    repository: docker.io/alpine/k8s
    tag: "1.36.2"
    pullPolicy: IfNotPresent
  # A retry re-walks every candidate host, doing a deployment rollout per host,
  # which does not fit in activeDeadlineSeconds — so retries just burn time and
  # produce a cluster of Error pods per failed job. Give up and wait for the next
  # schedule instead.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  rolloutTimeout: 240s
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  vpngate:
    country: ""
    # Pin to one VPNGate host. Empty means "any host matching country".
    host: ""
    random: true

# Probe the proxy and rotate as soon as it breaks, instead of waiting for
# rotation.schedule. Requires rotation.enabled (it execs the rotator's script).
healthcheck:
  enabled: false
  schedule: "*/5 * * * *"
  activeDeadlineSeconds: 900
  backoffLimit: 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # Space-separated. These are what "working" means for your workload, so set them
  # to URLs your app actually fetches — a proxy can be up and still be blocked by
  # the origin you care about.
  validationUrls: "http://example.com/ https://example.com/"
  validationTimeoutSeconds: 20
  # Rotate once this many probes have failed.
  failuresAllowed: 1

tor:
  image:
    repository: docker.io/dperson/torproxy
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}

vpngate:
  existingSecret: ""
  secretKey: client.ovpn
  inlineConfig: ""
  openvpn:
    image:
      repository: docker.io/dperson/openvpn-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - openvpn
      - --config
      - /vpn/client.ovpn
      - --route
      - 10.0.0.0
      - 255.0.0.0
      - net_gateway
      - --route
      - 172.16.0.0
      - 255.240.0.0
      - net_gateway
      - --route
      - 192.168.0.0
      - 255.255.0.0
      - net_gateway
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - ip link show tun0 >/dev/null 2>&1
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 4
    readinessProbe:
      exec:
        command:
          - sh
          - -c
          - ip link show tun0 >/dev/null 2>&1
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 1
    securityContext:
      capabilities:
        add:
          - NET_ADMIN
      privileged: true
    resources: {}
  proxy:
    image:
      repository: docker.io/vimagick/tinyproxy
      tag: latest
      pullPolicy: IfNotPresent
    port: 8888
    resources: {}
  # Fixed-upstream TCP relay for protocols that cannot use an HTTP proxy.
  # Keep disabled unless the destination and research purpose are explicit.
  tcpRelay:
    enabled: false
    upstreamHost: whois.jprs.jp
    upstreamPort: 43
    image:
      repository: docker.io/alpine/socat
      tag: 1.8.1.3
      pullPolicy: IfNotPresent
    resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
